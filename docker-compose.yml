name: flow

services:

  # =========================================
  # PostgreSQL
  # =========================================
  postgres:
    image: postgres:17
    container_name: flow-postgres

    entrypoint: ["/bin/bash", "/usr/local/bin/docker-entrypoint.sh"]
    command: ["postgres"]

    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow

    ports:
      - "5432:5432"

    volumes:
      - flow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =========================================
  # Redis
  # =========================================
  redis:
    image: redis:7
    container_name: flow-redis

    ports:
      - "6379:6379"

    volumes:
      - flow_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================================
  # FLOW API
  # =========================================
  api:
    build: .
    container_name: flow-api

    command: ["node", "dist/server.js"]

    environment:
      DATABASE_URL: postgresql://flow:flow@postgres:5432/flow
      REDIS_URL: redis://redis:6379
      PORT: 8000

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================================
  # FLOW SCHEDULER
  # =========================================
  scheduler:
    build: .

    command: ["node", "dist/scheduler.js"]

    environment:
      DATABASE_URL: postgresql://flow:flow@postgres:5432/flow
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================================
  # FLOW WORKER 1
  # =========================================
  worker-1:
    build: .
    container_name: flow-worker-1

    command: ["node", "dist/worker.js"]

    environment:
      DATABASE_URL: postgresql://flow:flow@postgres:5432/flow
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================================
  # FLOW WORKER 2
  # =========================================
  worker-2:
    build: .
    container_name: flow-worker-2

    command: ["node", "dist/worker.js"]

    environment:
      DATABASE_URL: postgresql://flow:flow@postgres:5432/flow
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================================
  # FLOW WORKER 3
  # =========================================
  worker-3:
    build: .
    container_name: flow-worker-3

    command: ["node", "dist/worker.js"]

    environment:
      DATABASE_URL: postgresql://flow:flow@postgres:5432/flow
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================================
  # FLOW WORKER MONITOR
  # =========================================
  monitor:
    build: .

    command: ["node", "dist/monitor.js"]

    environment:
      DATABASE_URL: postgresql://flow:flow@postgres:5432/flow
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


# =========================================
# Persistent volumes
# =========================================
volumes:
  flow_postgres_data:
    name: flow_postgres_data

  flow_redis_data:
    name: flow_redis_data